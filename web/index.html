<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="description" content="タスクを処理し、機能を選び、あなたのプログラミング言語を設計するローグライト・アクション。">
  <meta name="theme-color" content="#F4F3EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Runtime Survivors">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <title>Runtime Survivors</title>
  <style>
    body { margin: 0; background: #f4f3eb; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center;
      text-align: center; color: #263d37; font: 14px monospace; }
    #loading span { color: #dc653d; font-size: 38px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div id="loading" role="status"><span>&gt;_</span>Starting your runtime…</div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
