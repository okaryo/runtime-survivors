name: runtime_survivors
description: A roguelite about surviving tasks and designing a programming language.
publish_to: none
version: 0.15.0+17

environment:
  sdk: ^3.13.7
  flutter: '3.47.8'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  cupertino_icons: ^2.0.0
  web: ^1.1.2
  shared_preferences: ^2.5.6
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/runtime_loop.wav
    - assets/icons/upgrades/
    - assets/fonts/roboto_mono/OFL.txt
    - assets/fonts/noto_sans_jp/OFL.txt
  fonts:
    - family: RuntimeSansJP
      fonts:
        - asset: assets/fonts/noto_sans_jp/RuntimeSansJP.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/roboto_mono/RobotoMono.ttf
